# R80 CI. Each job only calls a script in ci/, so every check also runs locally:
#   ci/check_static.sh
#   ci/run_boat_sil.sh [--install]
#   ci/build_android.sh
#
# Runs on pushes to every branch (R80 does not use pull requests, see AGENTS.md
# section 4) and by hand from the Actions tab.

name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system libraries for headless Qt (AGENTS.md section 3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libglib2.0-0t64 libdbus-1-3 libgssapi-krb5-2 libx11-6
      - name: Install Python dependencies
        run: python3 -m pip install PySide6 cantools python-can
      - name: Static checks
        run: ci/check_static.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/ci/screenshots/
          if-no-files-found: ignore
          retention-days: 14


  android:
    # The R80 Companion app (companion-android/, D11): unit tests and a debug APK.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"
          cache-provider: basic   # the MIT-licensed cache, not the proprietary default
      - name: The fixed debug key (secret ANDROID_DEBUG_KEYSTORE), so each APK installs as an update
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore; fi
      - name: Build and unit-test the app
        run: ci/build_android.sh
      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r80-companion
          path: build/ci/android/
          if-no-files-found: ignore
          retention-days: 14

  boat-sil:
    # The BoAt tests against the virtual headunit, with the BoAt release
    # pinned in ci/boat.version. System Python (3.12): boat-py needs 3.11+ and
    # the D-Bus bindings come from apt.
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install vcan, D-Bus and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus python3-dbus python3-gi python3-venv \
            gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            dlt-daemon dlt-tools
          sudo systemctl disable --now dlt dlt-system dlt-dbus || true   # the HU starts its own (hu/services/dlt-daemon.sh)
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe vcan
      - name: BoAt smoke tests
        run: ci/run_boat_sil.sh --install
      - name: Summary
        if: always()
        run: |
          python3 ci/boat_report.py build/ci-boat/reports \
            --title "$(cat build/ci-boat/boat/tested.txt 2>/dev/null || echo 'BoAt (install failed)')" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload BoAt reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boat-reports
          path: |
            build/ci-boat/reports/
            build/ci-boat/logs/
          if-no-files-found: ignore
          retention-days: 14

  boat-sil-dut:
    # The same BoAt smoke tests with the DUT (mcu_emu + vehicled + mediad) in a Debian
    # Trixie container per CPU: arm64 like the Pi bench (QEMU-emulated), amd64 in case
    # the final hardware is x86. BoAt stays on the x86 host: it runs on the test PC only.
    needs: static
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    name: boat-sil-dut (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install vcan, D-Bus, Python packages and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus python3-dbus python3-gi python3-venv qemu-user-static
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe vcan
      - name: Check that ${{ matrix.arch }} containers run
        run: docker run --rm --platform linux/${{ matrix.arch }} debian:trixie uname -m
      - name: BoAt smoke tests, ${{ matrix.arch }} DUT
        run: ci/run_boat_sil.sh --install --dut-arch=${{ matrix.arch }}
      - name: Summary
        if: always()
        run: |
          python3 ci/boat_report.py build/ci-boat/reports \
            --title "${{ matrix.arch }} DUT, $(cat build/ci-boat/boat/tested.txt 2>/dev/null || echo 'BoAt (install failed)')" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload BoAt reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boat-reports-dut-${{ matrix.arch }}
          path: |
            build/ci-boat/reports/
            build/ci-boat/logs/
          if-no-files-found: ignore
          retention-days: 14

  static-arm64:
    # The same static checks on the bench target: aarch64, Debian 13 "Trixie" like
    # Raspberry Pi OS 64-bit (docs/bench-pi.md), its Python and a PySide6 venv.
    # BoAt is not run here: it runs on the x86 test PC, the Pi is the DUT.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install Debian packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0t64 libdbus-1-3 libgssapi-krb5-2 libx11-6
      - uses: actions/checkout@v7
      - name: Python venv with the R80 dependencies
        run: |
          python3 -m venv /opt/r80-venv
          /opt/r80-venv/bin/pip install PySide6 cantools python-can
      - name: Static checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uname -m && python3 --version
          PYTHON=/opt/r80-venv/bin/python ci/check_static.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-arm64
          path: build/ci/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  python-3-9:
    # AGENTS.md section 9 promises Python 3.9+. Compile only: no dependencies needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: py_compile on Python 3.9
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile

  release:
    # A tag v<major>.<minor>.<patch>, once the checks and the BoAt tests passed: the signed update
    # file of the HU software as a GitHub Release (D12; the app fetches it from there).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, static-arm64, boat-sil, boat-sil-dut]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build, sign and publish the update file
        env:
          R80_UPDATE_KEY: ${{ secrets.R80_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ci/release.sh
