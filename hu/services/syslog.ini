# hu-syslogd configuration (decision D14): which lines of the system's own log (the systemd
# journal) go into the HU's DLT log, and how they are cleaned first. Read first; /etc/r80/syslog.ini
# and then hu/syslogd.py --config override single keys. syslogd refuses to start on a bad value.
#
# The DLT log leaves the car (Settings -> Diagnostics -> export), so the journal's lines are
# cleaned before they are written: Bluetooth addresses keep only their last two bytes (..:EE:FF),
# long digit runs (phone numbers) become "<number>", and a line that names a device, a person or a
# network is left out. The HU's own services already log to DLT; their output is not read again.

[syslog]
# The same line from the same source within this many seconds is written once; when the time is
# up, one more line says how often it came ("... (repeated 85 times in 10 s)").
repeat_s = 10
# A run of at least this many digits (spaces, "-" and a leading "+" allowed in between) is a
# phone number: it becomes "<number>".
number_digits = 7
# A line that matches one of these (Python regular expressions, one per line) is left out;
# "(left out: the line holds a name)" is written in its place.
drop = (?i)\b(name|alias|ssid|hostname|friendly ?name)\b\s*[:=]

# One section per source, in this order: the first one whose match fits takes the line.
#   match        FIELD=pattern, comma-separated (journal fields; * and ? as in file names);
#                any one of them fits
#   level        the lowest level written: fatal, error, warning, info, debug, verbose
#                (DLT Viewer or Settings -> Diagnostics can change it while the HU runs; "default"
#                there is the DLT daemon's default, info, as for the services)
#   context      the DLT context (up to 4 characters) and its description
#   mask_quoted  yes: text in quotes becomes '…' (connection and network names)

[source kernel]
match = _TRANSPORT=kernel
level = warning
context = KERN
description = Linux kernel

[source bluez]
match = SYSLOG_IDENTIFIER=bluetoothd, SYSLOG_IDENTIFIER=obexd
level = info
context = BT
description = BlueZ (Bluetooth)

[source pipewire]
# below warning, PipeWire's telephony can log the numbers of calls
match = SYSLOG_IDENTIFIER=pipewire, SYSLOG_IDENTIFIER=pipewire-pulse, SYSLOG_IDENTIFIER=wireplumber
level = warning
context = PW
description = PipeWire and WirePlumber (sound)

[source network]
match = SYSLOG_IDENTIFIER=NetworkManager, SYSLOG_IDENTIFIER=wpa_supplicant
level = warning
context = NET
description = NetworkManager, Wi-Fi
mask_quoted = yes

[source units]
# the HU's own system units (CAN tunnel, Bluetooth call audio), not the HU itself
match = _SYSTEMD_UNIT=r80-*.service
level = info
context = UNIT
description = The HU's system units (r80-*)

[source systemd]
# a unit that failed, restarts, timeouts
match = SYSLOG_IDENTIFIER=systemd
level = warning
context = SYSD
description = systemd (failed units)
