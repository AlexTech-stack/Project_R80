# hu-sysd configuration (decision D12). Read first; /etc/r80/system.ini and then
# hu/sysd.py --config override single keys. sysd refuses to start on a bad value.
#
# Every user setting is a [setting <name>] section: its type and allowed values and the
# value a fresh HU starts with. The values the user chose are state, saved apart from
# this file (sysd --state). Types:
#   bool     true / false
#   number   min .. max (a float)
#   choice   one of choices (comma separated)

[setting accent]
# Accent colour of the line-art UI (Theme.qml has the colours).
type = choice
choices = signal_red, amber, arctic_white, ice_blue
default = signal_red

[setting brightness]
# The user's display brightness. By day it is the brightness; at night the car's
# dimmer gives the base and this shifts it (D12).
type = number
min = 0.2
max = 1.0
default = 0.9

[setting night_dimming]
# Follow the car's lights and dimmer at night.
type = bool
default = true

[setting clock_24h]
type = bool
default = true

[setting phone_remote]
# the R80 Companion app may control the media and the volume (the passenger's remote, docs/companion-protocol.md)
type = bool
default = true

[setting units]
type = choice
choices = metric, imperial
default = metric

[brightness]
# The display brightness sysd publishes (DisplayBrightness, D12). By day it is the user's
# brightness setting. At night (lights on, dim at night on) the car's dimmer (DimLevel
# 0..100 from the MCU) gives the base, between night_min and night_max of full brightness;
# the user's setting shifts it: at the setting's default the display follows the dimmer
# exactly, a brighter or darker setting scales it. Never darker than floor.
night_min = 0.1
night_max = 0.7
floor = 0.05

[info]
# Settings -> System: how often sysd refreshes the system information (Info), in seconds,
# and the HU services it expects on the bus (shown as running / missing).
refresh_s = 5
services = de.r80.Vehicle, de.r80.Media, de.r80.Audio, de.r80.Warnings, de.r80.Trip, de.r80.Nav, de.r80.System, de.r80.Phone

[diagnostics]
# Settings -> System -> Diagnostics (hu/services/diagnostics.py): the last `keep` warnings and
# errors of the DLT log, and the DLT applications in this order (others after them)
keep = 50
apps = HMI, VEH, MED, AUD, WRN, TRP, NAV, SYS, PHN, OS

[update]
# Software updates of the HU software (D12, hu/services/update.py): the update file comes from the
# phone (the R80 Companion app) or a USB stick (R80-update/*.r80u); sysd checks it and installs it
# next to the running release; it starts with the next start of the HU, or at once with "Restart
# now" while the car stands still.
# A new release must be healthy within health_s after it started: every [info] service on the bus
# and, with health_needs_ui, the UI in the DLT log. Otherwise sysd switches back to the previous
# release; one that does not even get that far is given up after max_starts starts.
health_s = 60
health_needs_ui = yes
max_starts = 2
# Also trust development keys (public *.pem in hu/sysd.py --dev-keys): the bench yes, the car no
# (bench/pi/r80-kiosk.sh passes --allow-dev-key).
allow_dev_key = no
# "Restart now" only below this speed (km/h), and only while the speed is known.
standstill_kmh = 1

[shutdown]
# When the MCU announces off (vehicled Power = shutdown), the services that keep state
# (audiod, tripd, sysd itself) save it. sysd waits for each of them at most this long (s),
# then acknowledges to the MCU. The MCU cuts the power at the latest 10 s after asking
# (placeholder MCU firmware, mcu_emu): keep this well below that.
save_timeout_s = 3
# After the acknowledgement: none (bench, PC) or poweroff (target: Linux halts cleanly
# before the MCU cuts the power, D12).
after_ack = none
