# hu-assistd configuration (the voice assistant). Read first; /etc/r80/assistant.ini and then
# hu/assistd.py --config override single keys. assistd refuses to start on a bad value.
# Switched on and off by the driver: the setting "assistant" (hu-sysd, system.ini).

[speech]
# Speech to text: moonshine (on the HU, sherpa-onnx) or transcript (tests: the recorded speech's text).
recognizer = moonshine
# Text to speech: piper (on the HU, sherpa-onnx; phonemes from espeak-ng) or silent (tests).
voice = piper
# Where the models are; empty: $XDG_DATA_HOME/r80/speech (./r80 bench speech installs them there).
model_dir =
recognizer_model = sherpa-onnx-moonshine-tiny-en-int8
# kathleen low: CC0, a little faster than real time on a Pi 3 (docs/bench-measurements.md)
voice_model = vits-piper-en_US-kathleen-low
# CPU threads for each engine.
threads = 2
# The microphone: a GStreamer source (autoaudiosrc: the system's default input).
mic = autoaudiosrc

[listen]
# Speech starts above this level (dB below full scale) ...
speech_level_db = -40
# ... and ends after this much quiet.
end_silence_ms = 800
# Nobody talks longer than this in one go.
max_speech_s = 10
# Command mode: nothing said for this long, the assistant says so and ends.
no_speech_s = 6
# Conversation mode: nothing said for this long, the conversation ends by itself.
conversation_idle_s = 60

[talk]
# What the assistant says when it starts listening, when it heard nothing, and when a
# conversation ends. Kept short: they are made once at start.
greeting = I'm here.
not_heard = Sorry, I didn't catch that.
conversation_end = Okay.
# Speaking speed (1.0 = the voice's own).
speed = 1.0

[llm]
# Who answers: phone (the R80 Companion app asks the LLM with the user's own key, over the companion
# link through hu-navd) or echo (no phone: repeats what it heard; development).
backend = phone
# The longest answer, in tokens (the model's thinking counts too).
max_tokens = 800
# What goes along of a conversation: the newest turns, at most this many characters.
max_history_chars = 24000
# How long it waits for the phone's answer (s); hu-navd gives up after its own [assistant] timeout_s.
timeout_s = 35
# echo only: how long it "thinks" (s), so the thinking state shows.
think_s = 0.5
# What the LLM is told before every question (the date and time are added).
system_prompt = You are the voice assistant of the R80 headunit in the driver's car. The driver is
    driving and hears your answer read aloud by a speech synthesizer: answer in English, in one to three
    short sentences of plain text. No lists, no markdown, no emoji, no URLs. Use metric units and the
    24-hour clock. If you do not know something, say so briefly. Never make up values of the car.

[errors]
# What the assistant says when there is no answer, per reason (the phone's or hu-navd's code).
no_phone = I can't answer: no phone with the R80 app is connected.
no_key = I can't answer: the R80 app has no API key.
bad_key = I can't answer: the app's API key was refused.
no_credit = I can't answer: the account has no credit left.
offline = I can't reach the internet through the phone.
timeout = The answer took too long.
busy = The service is busy. Please try again.
other = Sorry, I can't answer right now.
