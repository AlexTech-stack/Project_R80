# The headunit's DLT daemon (COVESA dlt-daemon, DLT protocol version 1), started by
# hu/services/dlt-daemon.sh, which fills in the @...@ paths. Options: man dlt.conf.

# ECU ID in every message and in the files' storage headers
ECUId = R80

# DLT Viewer and dlt-receive connect over TCP (port: dlt-daemon.sh, default 3490)
SendContextRegistration = 1
SendMessageTime = 0
Verbose = 0

# the daemon's own messages go to stdout (the service log)
LoggingMode = 0
LoggingLevel = 5

# a new context logs info and up; a level set from outside (DLT Viewer, Settings -> System)
# is kept here when the client asks to store it (Store Configuration)
ContextLogLevel = 4
ContextTraceStatus = 0
PersistanceStoragePath = @STATE@

# until a client connects, messages wait in this buffer
RingbufferMinSize = 500000
RingbufferMaxSize = 4000000
RingbufferStepSize = 500000

# every message also goes to files on the HU: a ring of 8 x 2 MB (16 MB), the oldest file goes first
OfflineTraceDirectory = @TRACE@
OfflineTraceFileSize = 2000000
OfflineTraceMaxSize = 16000000
OfflineTraceFileNameTimestampBased = 1

ControlSocketPath = @RUN@/dlt-ctrl.sock
