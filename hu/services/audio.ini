# hu-audiod configuration (decision D9). Read first; /etc/r80/audio.ini and then
# hu/audiod.py --config override single keys. audiod refuses to start on a bad value.
# The volumes the driver sets are state, not config: they live in audiod's --state file.

[volume]
# Scale of the master and source volumes: 0 .. max.
max = 30
# Master volume when audiod starts is never above this (a lower saved volume stays).
startup_cap = 12
# Used when there is no saved state yet.
default_master = 12
default_media = 30
default_navigation = 30
default_phone = 30
default_radio = 30
default_chime = 30
default_voice = 30
# gain = ((master / max) * (source / max)) ** curve; 2.0 sounds roughly even per step.
curve = 2.0
# Every volume and mute change is a ramp this long; a jump would click.
change_fade_ms = 50
# Speech from the phone arrives far quieter than music: a call plays this much louder than
# the phone volume alone would give (dB, applied by hu-phoned on the call's own stage).
call_boost_db = 12

[focus]
# How sources affect each other (decision D9).
# While a navigation prompt plays, media and radio go down to this share of their gain ...
duck_level = 0.30
# ... fading over this time (also back up afterwards).
duck_fade_ms = 300
# While the voice assistant listens, media and radio go down to this share (its microphone
# hears the music); while it speaks, to duck_level as for a prompt.
listen_duck_level = 0.10
# A call counts from "ring" (incoming, not answered yet) or only from "answer".
call_starts_on = ring
# During a call media is paused; play it again afterwards if it was playing before.
resume_media_after_call = yes
# When the HU goes off (after the shutdown save), media playing is paused; it plays
# again when the HU is back on. Not at "shutdown": mediad has to save "playing" first.
pause_media_when_off = yes
# Radio cannot pause, so it is silent during a call.
call_mutes_radio = yes
# The mute key silences everything except the phone during a call.
mute_spares_call = yes
# The warning chime (act within seconds, D10) ignores mute and never plays quieter than this.
# The information chime is a normal source: chime volume, silent when muted.
warning_chime_min_gain = 0.25

[tone]
# Tone controls (Settings -> Audio). audiod keeps and saves them; they take effect once
# the DSP amplifier (D3) is chosen and driven. Bass and treble in dB steps.
tone_range_db = 6
default_bass = 0
default_treble = 0
# Balance -1.0 (left) .. 1.0 (right).
default_balance = 0
default_loudness = yes
