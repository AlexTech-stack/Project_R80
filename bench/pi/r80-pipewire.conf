# PipeWire for the R80 headunit (bench; the target needs the same).
# install-units.sh copies this to ~/.config/pipewire/pipewire.conf.d/80-r80.conf.

# The sound of a call goes through a stage of its own: the phone sends at full level
# (WirePlumber routes the call stream to "r80_call", r80-telephony.conf) and hu-phoned sets
# the level on "r80_call_out" in software: hu-audiod's phone volume plus a call boost
# (speech arrives far quieter than music). Echo cancellation for the car fits in here later.
# Music from the phone (A2DP) likewise: into "r80_bt_music", hu-mediad sets the media level
# on "r80_bt_music_out" (and closes it while another source plays).
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "R80 call"
      audio.position = [ MONO ]
      capture.props = {
        node.name = "r80_call"
        media.class = "Audio/Sink"
      }
      playback.props = {
        node.name = "r80_call_out"
        node.passive = true
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "R80 Bluetooth music"
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "r80_bt_music"
        media.class = "Audio/Sink"
      }
      playback.props = {
        node.name = "r80_bt_music_out"
        node.passive = true
      }
    }
  }
]
