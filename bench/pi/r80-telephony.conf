# WirePlumber: PipeWire's Bluetooth call control on D-Bus (org.pipewire.Telephony, PipeWire 1.4+),
# which hu-phoned uses for calls (answer, hang up, dial, caller ID). It is off by default.
# install-units.sh copies this to ~/.config/wireplumber/wireplumber.conf.d/.
monitor.bluez.properties = {
  bluez5.telephony-dbus-service = true
}
