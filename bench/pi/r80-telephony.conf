# WirePlumber settings for the R80 headunit's Bluetooth audio (bench; the target needs the same).
# install-units.sh copies this to ~/.config/wireplumber/wireplumber.conf.d/80-r80-telephony.conf.

# PipeWire's Bluetooth call control on D-Bus (org.pipewire.Telephony, PipeWire 1.4+), which
# hu-phoned uses for calls (answer, hang up, dial, caller ID). It is off by default.
monitor.bluez.properties = {
  bluez5.telephony-dbus-service = true
}

# No "hardware volume": by default PipeWire passes a Bluetooth stream's volume to the phone
# (AT+VGS for calls, AVRCP absolute volume for music) and the phone turns itself down on
# its own, steep curve; calls came out far quieter than music. Without it the phone sends
# at full level and the HU sets the level itself (hu-audiod, D9), and the HU's volume knob
# does not move the phone's volume sliders.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.hw-volume = [ ] } }
  }
]
