# hu-navd configuration (decision D11). Read first; /etc/r80/nav.ini and then
# hu/navd.py --config override single keys. navd refuses to start on a bad value.

[link]
# Told to the phone in the HU's hello: send something at least this often (s).
heartbeat_s = 2
# The phone link counts as lost when nothing arrived for this long (s).
link_timeout_s = 6
# A new connection has to send its hello within this time (s), or it is closed.
hello_timeout_s = 5

[guidance]
# After the phone link is lost, the last guidance stays on screen, marked as
# stale, for this long (s). A reconnect within that time continues seamlessly.
keep_after_loss_s = 30
