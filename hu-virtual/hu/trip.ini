# hu-tripd configuration (decision D10). Read first; /etc/r80/trip.ini and then
# hu/tripd.py --config override single keys. tripd refuses to start on a bad value.

[trip]
# The "since start" trip starts over when the ignition was off longer than this.
auto_reset_h = 2
# Driving time counts while hu-vehicled reports one of these power states.
count_time_in = on
# An odometer step larger than this (km) is a glitch or a new value, not driving.
max_odometer_jump_km = 5
# Average speed is shown once at least this much driving time has counted.
min_time_for_average_s = 60
