# hu-sysd configuration (decision D12). Read first; /etc/r80/system.ini and then
# hu/sysd.py --config override single keys. sysd refuses to start on a bad value.
#
# Every user setting is a [setting <name>] section: its type and allowed values and the
# value a fresh HU starts with. The values the user chose are state, saved apart from
# this file (sysd --state). Types:
#   bool     true / false
#   number   min .. max (a float)
#   choice   one of choices (comma separated)

[setting accent]
# Accent colour of the line-art UI (Theme.qml has the colours).
type = choice
choices = signal_red, amber, arctic_white, ice_blue
default = signal_red

[setting brightness]
# The user's display brightness. By day it is the brightness; at night the car's
# dimmer gives the base and this shifts it (D12).
type = number
min = 0.2
max = 1.0
default = 0.9

[setting night_dimming]
# Follow the car's lights and dimmer at night.
type = bool
default = true

[setting clock_24h]
type = bool
default = true

[setting units]
type = choice
choices = metric, imperial
default = metric
