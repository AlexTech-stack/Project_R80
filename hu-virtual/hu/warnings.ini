# hu-warnd configuration (decision D10). Read first; /etc/r80/warnings.ini and then
# hu/warnd.py --config override single keys. warnd refuses to start on a bad value.
#
# THE NUMBERS ARE PLACEHOLDERS, not the values of the real car. Adjust them here.
#
# One section per warning. Kinds, by the keys a section has:
#   below / above (+ clear_above / clear_below)  value past a threshold; clears with hysteresis
#   drop_rate (+ window_s, hold_s)                value falling at least drop_rate per second,
#                                                 measured over window_s; stays hold_s after it stops
#   diff_above (+ diff_clear)                     two signals differ by more than diff_above
#   stale = yes                                   no data for a signal (hu-vehicled StaleSignals)
# Common keys:
#   signal / signals   one DBC signal name, or several (one warning each), "*" = every signal a
#                      rule above uses (only for stale)
#   labels             comma-separated names for the signals, used as {label} in the text
#   for_s              condition must hold this long before the warning is raised (default 0)
#   when               engine_running: only while EngineSpeed > engine_running_rpm
#   severity           info | warning | critical  (info: list only; warning, critical: banner)
#   text               shown to the driver; {value} and {label} are filled in

[general]
# Warnings are only evaluated while hu-vehicled reports one of these power states.
active_power = on, acc
engine_running_rpm = 400

[fuel_low]
signal = FuelLevel
below = 10
clear_above = 12
for_s = 5
severity = warning
text = Fuel low ({value:.0f} %)

[range_low]
signal = Range
below = 50
clear_above = 60
for_s = 5
severity = warning
text = Range low ({value:.0f} km)

[coolant_hot]
signal = CoolantTemp
above = 110
clear_below = 105
for_s = 5
severity = warning
text = Coolant temperature high ({value:.0f} °C)

[coolant_critical]
signal = CoolantTemp
above = 120
clear_below = 115
for_s = 2
severity = critical
text = Coolant temperature critical ({value:.0f} °C)

[oil_temp_high]
signal = OilTemp
above = 130
clear_below = 125
for_s = 5
severity = warning
text = Oil temperature high ({value:.0f} °C)

[oil_pressure_low]
signal = OilPressure
below = 0.5
clear_above = 0.7
for_s = 2
when = engine_running
severity = critical
text = Oil pressure low ({value:.1f} bar)

[oil_pressure_dropping]
signal = OilPressure
drop_rate = 0.1
window_s = 2
hold_s = 10
when = engine_running
severity = critical
text = Oil pressure dropping fast ({value:.2f} bar/s)

[battery_low]
signal = BatteryVoltage
below = 11.8
clear_above = 12.2
for_s = 10
when = engine_running
severity = warning
text = Battery voltage low ({value:.1f} V)

[battery_high]
signal = BatteryVoltage
above = 15.0
clear_below = 14.6
for_s = 10
when = engine_running
severity = warning
text = Battery voltage high ({value:.1f} V)

[tyre_low]
signals = TyrePressureFL, TyrePressureFR, TyrePressureRL, TyrePressureRR
labels = front left, front right, rear left, rear right
below = 1.8
clear_above = 1.9
for_s = 5
severity = warning
text = Tyre pressure low, {label} ({value:.1f} bar)

[tyre_dropping]
signals = TyrePressureFL, TyrePressureFR, TyrePressureRL, TyrePressureRR
labels = front left, front right, rear left, rear right
drop_rate = 0.1
window_s = 2
hold_s = 10
severity = critical
text = Tyre pressure dropping fast, {label} ({value:.2f} bar/s)

[tyre_imbalance_front]
signals = TyrePressureFL, TyrePressureFR
diff_above = 0.3
diff_clear = 0.2
for_s = 10
severity = warning
text = Tyre pressures differ, front ({value:.2f} bar)

[tyre_imbalance_rear]
signals = TyrePressureRL, TyrePressureRR
diff_above = 0.3
diff_clear = 0.2
for_s = 10
severity = warning
text = Tyre pressures differ, rear ({value:.2f} bar)

[service_distance]
signal = ServiceDistance
below = 1000
clear_above = 1000
severity = info
text = Service due in {value:.0f} km

[service_days]
signal = ServiceDays
below = 30
clear_above = 30
severity = info
text = Service due in {value:.0f} days

[sensor_missing]
signals = *
stale = yes
for_s = 2
severity = warning
text = No data: {label}
