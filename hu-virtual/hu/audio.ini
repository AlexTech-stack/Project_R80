# hu-audiod configuration (decision D9). Read first; /etc/r80/audio.ini and then
# hu/audiod.py --config override single keys. audiod refuses to start on a bad value.
# The volumes the driver sets are state, not config: they live in audiod's --state file.

[volume]
# Scale of the master and source volumes: 0 .. max.
max = 30
# Master volume when audiod starts is never above this (a lower saved volume stays).
startup_cap = 12
# Used when there is no saved state yet.
default_master = 12
default_media = 30
default_navigation = 30
default_phone = 30
default_radio = 30
# gain = ((master / max) * (source / max)) ** curve; 2.0 sounds roughly even per step.
curve = 2.0

[focus]
# How sources affect each other (decision D9).
# While a navigation prompt plays, media and radio go down to this share of their gain ...
duck_level = 0.30
# ... fading over this time (also back up afterwards).
duck_fade_ms = 300
# A call counts from "ring" (incoming, not answered yet) or only from "answer".
call_starts_on = ring
# During a call media is paused; play it again afterwards if it was playing before.
resume_media_after_call = yes
# Radio cannot pause, so it is silent during a call.
call_mutes_radio = yes
# The mute key silences everything except the phone during a call.
mute_spares_call = yes
